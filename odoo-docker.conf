[options]
; Configuration du conteneur Odoo — à ne pas confondre avec `odoo.conf`, qui
; décrit l'installation Windows locale (chemins `C:\...`, base sur localhost).
; Les deux coexistent volontairement : le dépôt sert aux deux modes.

; Chemins DANS le conteneur. `/mnt/extra-addons` est le montage de
; `custom_addons/` ; les addons standard viennent de l'image.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Filestore : dans le volume nommé `odoo-web-data`.
data_dir = /var/lib/odoo

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Laissé vide : le sélecteur de base reste accessible, ce qui permet de créer
; une base neuve pour une démonstration sans toucher à la configuration.
db_name =
dbfilter =
list_db = True

; Mot de passe maître de l'écran de gestion des bases. À changer avant toute
; exposition hors poste de développement.
admin_passwd = opex_admin

http_port = 8069
http_interface = 0.0.0.0
proxy_mode = False

; Les tests créent et détruisent des bases : laisser les données de
; démonstration désactivées évite de polluer une base de présentation.
without_demo = all

log_level = info
limit_time_real = 300
